<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuin App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Tuin App</h1>

    <label for="vak-select-add">Kies een vak:</label>
    <select id="vak-select-add">
        <option value="">-- Kies een vak --</option>
    </select>
    <button id="open-plant-select">Plant toevoegen</button>

    <!-- Plant modal -->
    <div id="plant-select-modal" class="modal">
        <div class="modal-content">
            <span id="select-close" class="close">&times;</span>
            <input type="text" id="plant-search" placeholder="Zoek plant...">
            <div id="plant-options" class="plant-options"></div>
        </div>
    </div>

    <h2>Jouw tuin</h2>
    <div id="garden-grid" class="garden-grid"></div>

    <script src="script.js"></script>
</body>
</html>

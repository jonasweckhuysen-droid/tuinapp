<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn Tuin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Mijn Tuin</h1>

<div id="garden-grid"></div>

<!-- Plant info modal -->
<div id="plant-modal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2 id="plant-name"></h2>
    <img id="plant-image" src="images/default.png" alt="Plant afbeelding">
    <p><strong>Wetenschappelijke naam:</strong> <span id="plant-scientific"></span></p>
    <p><strong>Fertilization:</strong> <span id="plant-fertilization"></span></p>
    <p><strong>Maintenance:</strong> <span id="plant-maintenance"></span></p>
    <p><strong>Licht:</strong> <span id="plant-light"></span></p>
    <p><strong>Water:</strong> <span id="plant-water"></span></p>
  </div>
</div>

<!-- Plant selectiemodal -->
<div id="plant-select-modal" class="modal">
  <div class="modal-content">
    <span class="close" id="select-close">&times;</span>
    <h2>Kies een plant</h2>
    <div id="plant-options"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 Tuin App 🌿</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4caf50">
<link rel="apple-touch-icon" href="images/logo-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<h1 class="title">🌸 Tuin App 🌸</h1>

<div class="vak-select-container">
    <input type="text" id="vak-naam-input" placeholder="Nieuwe vak naam">
    <button id="add-vak-btn" class="btn-main">Vak toevoegen</button>
</div>

<h2>Jouw tuin</h2>

<div class="vak-select-container">
    <label for="vak-select-add">Kies een vak:</label>
    <select id="vak-select-add">
        <option value="">-- Kies een vak --</option>
    </select>
    <button id="open-plant-select" class="btn-main">Plant toevoegen</button>
</div>

<div id="vakkenContainer" class="garden-grid"></div>

<!-- Plant select modal -->
<div id="plantSelectModal" class="modal">
    <div class="modal-content">
        <span id="plantSelectClose" class="close">&times;</span>
        <h3>Kies een plant uit de database:</h3>
        <input type="text" id="plant-search" placeholder="Zoek plant..." class="search-box">
        <ul id="plantsList"></ul>

        <h4>Of voeg een nieuwe plant toe:</h4>
        <input type="text" id="new-plant-name" placeholder="Naam">
        <input type="text" id="new-plant-science" placeholder="Wetenschappelijke naam">
        <input type="text" id="new-plant-info" placeholder="Extra info">
        <input type="text" id="new-plant-img" placeholder="Afbeelding URL (optioneel)">
        <button id="add-new-plant" class="btn-main">Plant toevoegen</button>
    </div>
</div>

<!-- Plant detail modal -->
<div id="plantDetailModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closePlantDetails()">&times;</span>
        <div id="detailContent"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

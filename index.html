<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 Tuin App 🌿</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4caf50">
<link rel="apple-touch-icon" href="images/logo-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="title">🌸 Tuin App 🌸</h1>

<!-- Plant toevoegen knop -->
<div class="vak-select-container">
    <label for="vak-select-add">Kies een vak:</label>
    <select id="vak-select-add">
        <option value="">-- Kies een vak --</option>
    </select>
    <button id="open-plant-select" class="btn-main">Plant toevoegen</button>
</div>

<h2>Jouw tuin</h2>

<!-- Nieuw vak aanmaken onder titel -->
<div class="vak-select-container">
    <input type="text" id="vak-naam-input" placeholder="Nieuwe vak naam">
    <button id="add-vak-btn" class="btn-main">Vak toevoegen</button>
</div>

<div id="garden-grid" class="garden-grid"></div>

<!-- Plant Modal -->
<div id="plant-select-modal" class="modal">
    <div class="modal-content">
        <span id="select-close" class="close">&times;</span>
        <h3>Kies of voeg een plant toe:</h3>
        <input type="text" id="plant-search" placeholder="Zoek plant..." class="search-box">
        <div id="plant-options" class="plant-options"></div>

        <h4>Nieuwe plant toevoegen:</h4>
        <input type="text" id="new-plant-name" placeholder="Naam">
        <input type="text" id="new-plant-science" placeholder="Wetenschappelijke naam">
        <input type="text" id="new-plant-info" placeholder="Extra info">
        <input type="text" id="new-plant-img" placeholder="Afbeelding URL (optioneel)">
        <button id="add-new-plant" class="btn-main">Plant toevoegen</button>
    </div>
</div>

<!-- Plant info popup -->
<div id="plant-info-modal" class="modal">
    <div class="modal-content">
        <h2 id="info-plant-name"></h2>
        <img id="info-plant-img" style="width:100px;height:auto;border-radius:8px;margin:10px 0;">
        <p><strong>Wetenschappelijke naam:</strong> <span id="info-plant-science"></span></p>
        <p><strong>Extra info:</strong></p>
        <p id="info-plant-info"></p>
        <button id="info-close">Sluiten</button>
        <button id="edit-plant-btn">Bewerken</button>
    </div>
</div>

<!-- Plant bewerken modal -->
<div id="plant-edit-modal" class="modal">
    <div class="modal-content">
        <h2>Plant bewerken</h2>

        <label>Naam:</label>
        <input id="edit-plant-name" type="text">

        <label>Wetenschappelijke naam:</label>
        <input id="edit-plant-science" type="text">

        <label>Extra info:</label>
        <textarea id="edit-plant-info"></textarea>

        <label>Foto URL:</label>
        <input id="edit-plant-img" type="text">

        <button id="save-edit-plant">Opslaan</button>
        <button id="edit-close">Annuleren</button>
    </div>
</div>

<!-- Install button -->
<button id="install-btn" class="install-btn hidden">📥 Installeer Tuin App</button>

<!-- Install popup -->
<div id="install-popup" class="install-popup hidden">
    <div class="install-box">
        <h3>🌿 Tuin App installeren?</h3>
        <p>Zo heb je je tuin altijd bij de hand!</p>
        <button id="popup-install" class="btn-main">Installeren</button>
        <button id="popup-cancel" class="btn-cancel">Annuleren</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
